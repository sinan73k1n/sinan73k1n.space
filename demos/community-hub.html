<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community Hub — demo</title>
<!--
  ============================================================================
  COMMUNITY HUB — TEK DOSYA DEMO
  ============================================================================
  Yazdığım forum + SignalR canlı sohbet + bildirim/moderasyon sisteminin
  gezilebilir taklidi. Portfolyodaki demo alanına yapıştırılır, iframe içinde
  `sandbox="allow-scripts"` ile çalışır.

  🎮 TEMA (karar: 2026-08-12): oyun topluluğu — konu akışı, canlı sohbet ve
     oyunlarda dağıtılan promosyon kodları. Gösterilen mekanik gerçek sistemin
     kendisi: forum kaydı + oylama + rapor, SignalR sohbet, bildirim, moderasyon
     kuyruğu. Oyun/stüdyo adlarının hepsi UYDURMA — gerçek marka geçmez,
     ortaklık ima edilmez.

  ⛔ ANONİM: kullanıcı adı, mesaj, kod, rapor — hiçbiri gerçek değil. Gerçek
     platformun içeriği, kullanıcıları ve moderasyon kayıtları buraya taşınmadı.

  🌍 ARAYÜZ DİLİ İNGİLİZCE (karar: 2026-07-30). Kod yorumları Türkçe kalır.

  Kısıtlar (bilinçli):
   · Tek dosya, sıfır dış istek — font/CDN/görsel YOK (sandbox + CSP dostu).
     Avatarlar harf + deterministik renkle üretiliyor, resim indirilmiyor.
   · localStorage/cookie KULLANILMAZ: `allow-same-origin` verilmediği için
     depolama erişimi hata atar. Tüm durum bellekte (`S` nesnesi).
   · Gerçek zamanlılık SİMÜLE: WebSocket yok, tek `setInterval` sahte kullanıcı
     etkinliği üretiyor. SignalR'ın yaptığı iş bu değil ama EKRANDA gördüğü şey
     bu — demo bunu şeridinde açıkça söylüyor.
   · prefers-reduced-motion: reduce → canlı akış DURUR (kendiliğinden değişen
     içerik de harekettir), yerine elle tetikleme düğmesi gelir.
   · `window.__onizleme()`: site bu demoyu KÜÇÜK ÖNİZLEME olarak gömdüğünde
     çağırır → giriş ekranı atlanır (önizleme tıklanamaz, akış görünmeli).
  ============================================================================
-->
<style>
:root{
  --bg:#0d1017; --surface:#141926; --surface-2:#1b2233; --hover:#202940;
  --border:#252e42; --border-soft:#1c2436;
  --text:#e5e9f3; --dim:#8b93aa; --dimmer:#5d6580;
  --accent:#5b8cff; --accent-soft:#1e2a4d;
  --amber:#f5a524; --amber-soft:#2e2412;
  --green:#3fd68c; --green-soft:#122b21;
  --rose:#f2557a; --rose-soft:#31151f;
  --violet:#a78bfa;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

@keyframes pulse{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}

/* ---------- iskelet ---------- */
.shell{height:100vh;display:grid;grid-template-columns:224px 1fr;overflow:hidden}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--violet));
  display:grid;place-items:center;font-weight:800;font-size:14px;color:#0d1017;flex:none}
.brand .n{font-weight:700;letter-spacing:-.01em}
.brand .s{font-size:10.5px;color:var(--dimmer);font-family:var(--mono)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;cursor:pointer;
  color:var(--dim);border:0;background:none;text-align:left;width:100%;transition:background .13s,color .13s}
.nav-i:hover{background:var(--hover);color:var(--text)}
.nav-i.on{background:var(--accent-soft);color:#cfe0ff}
.nav-i .ic{width:17px;text-align:center;flex:none;font-size:14px}
.nav-i .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  background:var(--surface-2);border-radius:9px;padding:1px 7px}
.nav-i.on .ct{background:#25325a;color:#9db8ff}
.nav-i .ct.hot{background:var(--rose-soft);color:var(--rose)}
.me{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.me .info{min-width:0}
.me .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .rp{font-family:var(--mono);font-size:10.5px;color:var(--dimmer)}

.main{overflow-y:auto;position:relative;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(13,16,23,.93);backdrop-filter:blur(7px);
  border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--dimmer);font-size:11.5px;font-family:var(--mono)}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--green);
  font-family:var(--mono);background:var(--green-soft);border:1px solid #1c4536;border-radius:20px;padding:4px 11px;
  cursor:pointer}
.live.off{color:var(--dimmer);background:var(--surface-2);border-color:var(--border)}
.live .pip{position:relative;width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.live .pip::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:pulse 2s ease-out infinite}
.live.off .pip::after{animation:none}
/* Tam ekranda içerik sola yapışıp sağı boş bırakmasın: ortalanır ve geniş
   ekranda daha çok sütuna izin verir. Üst sınır okunabilirlik için: sınırsız
   genişlikte satırlar göz taramayacak kadar uzuyor. */
/* flex sutunu: sayfanin son blogu istedigi kadar uzayabilsin (sohbet
   kartinin tam ekranda alta kadar inmesi bununla oluyor; sabit bir
   calc() ust cubuk/demo seridi yuksekligi degisince tutmuyordu). */
.page{padding:18px 26px 40px;max-width:1440px;margin:0 auto;width:100%;
  flex:1;display:flex;flex-direction:column;min-height:0}

/* demo şeridi */
.demobar{display:flex;gap:10px;align-items:flex-start;border:1px solid #3a3016;background:#1a1608;
  border-radius:10px;padding:10px 13px;margin-bottom:18px;color:#d9c48a;font-size:11.5px;line-height:1.65}
.demobar b{color:var(--amber);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;flex:none;padding-top:1px}

/* ---------- ortak ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.card+.card{margin-top:10px}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;
  font-size:12.5px;color:#0d1017;flex:none;letter-spacing:-.02em}
.av.sm{width:24px;height:24px;border-radius:8px;font-size:10.5px}
.av.lg{width:38px;height:38px;border-radius:11px;font-size:14px}
.tag{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:8px;
  background:var(--surface-2);color:var(--dim);white-space:nowrap}
.tag.a{background:var(--accent-soft);color:#9db8ff}
.tag.g{background:var(--green-soft);color:var(--green)}
.tag.m{background:var(--amber-soft);color:var(--amber)}
.tag.r{background:var(--rose-soft);color:var(--rose)}
.tag.v{background:#231a42;color:var(--violet)}
.muted{color:var(--dim)}
.dimmer{color:var(--dimmer)}
.mono{font-family:var(--mono)}
.empty{border:1px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--dimmer);font-size:12.5px}
.hint{color:var(--dimmer);font-size:11.5px;line-height:1.65}
.sep{height:1px;background:var(--border);margin:16px 0}
.rowsplit{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2.sect{font-size:14px;margin:0;font-weight:700}

.btn{background:var(--accent);color:#08101f;border:0;border-radius:9px;padding:8px 15px;font-weight:600;
  cursor:pointer;transition:filter .13s,transform .08s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--dim)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.mini{padding:5px 11px;font-size:11.5px;border-radius:8px}
.btn.danger{background:var(--rose);color:#1b0710}
.btn.ok{background:var(--green);color:#062015}

input,textarea,select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;color:var(--text);
  padding:9px 11px;font-family:inherit;font-size:13px;outline:none;transition:border-color .13s,box-shadow .13s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #5b8cff22}
textarea{resize:vertical;min-height:66px;line-height:1.55}
label.lb{display:block;font-size:10.5px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* ---------- feed ---------- */
.topic{display:flex;gap:13px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);cursor:pointer;transition:border-color .13s,background .13s}
.topic+.topic{margin-top:8px}
.topic:hover{border-color:#31405f;background:var(--surface-2)}
.topic.fresh{animation:flash 2.4s ease-out, rise .3s ease-out}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;width:38px}
.vote button{background:none;border:0;color:var(--dimmer);cursor:pointer;font-size:13px;line-height:1;padding:3px 5px;border-radius:6px}
.vote button:hover{background:var(--hover);color:var(--text)}
.vote button.on.up{color:var(--green)}
.vote button.on.dn{color:var(--rose)}
.vote .sc{font-family:var(--mono);font-weight:700;font-size:13px}
.topic .body{min-width:0;flex:1}
.topic .ttl{font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.topic .meta{display:flex;align-items:center;gap:8px;color:var(--dimmer);font-size:11.5px;flex-wrap:wrap}
.topic .ex{color:var(--dim);font-size:12.5px;margin:5px 0 7px;max-width:96ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* thread */
.cmt{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--border-soft)}
.cmt .bd{min-width:0;flex:1}
.cmt .hd{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.cmt .nm{font-weight:600;font-size:12.5px}
.cmt .tx{color:#cfd5e6;font-size:13px}
.cmt .ac{display:flex;gap:12px;margin-top:6px;font-size:11.5px;color:var(--dimmer)}
.cmt .ac button{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.cmt .ac button:hover{color:var(--text)}

/* ---------- chat ---------- */
.chat-wrap{display:grid;grid-template-columns:1fr 210px;gap:14px;flex:1;min-height:0}
/* Yükseklik pencereye göre: tam ekranda kartın altında boş alan kalmasın,
   küçük ekranda da ezilmesin. 300px = üstteki başlık + demo şeridi payı. */
.chat{background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;
  min-height:320px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column}
/* Mesajlar alta yaslanir: az mesajla kartin ustu bos kalmasin, cok mesajla
   normal kaydirma calissin (justify-content:flex-end kaydirmayi bozar). */
.msgs-in{margin-top:auto}
/* ⛔ Animasyon SADECE yeni mesajda. Liste her yeniden çizimde baştan basıldığı
   için `.msg`e verildiğinde bütün mesajlar birlikte yeniden beliriyordu —
   ekran sürekli solgun görünüyordu. */
.msg{display:flex;gap:10px;padding:6px 0}
.msg.new{animation:rise .25s ease-out}
.msg .bd{min-width:0}
.msg .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.msg .nm{font-weight:600;font-size:12.5px}
.msg .tx{color:#cfd5e6;word-break:break-word}
.msg .del{margin-left:6px;background:none;border:0;color:var(--dimmer);cursor:pointer;font-size:11px;opacity:0}
.msg:hover .del{opacity:1}
.msg .del:hover{color:var(--rose)}
.msg.gone .tx{color:var(--dimmer);font-style:italic}
.typing{padding:2px 14px 8px;color:var(--dimmer);font-size:11.5px;height:22px}
.typing i{animation:blink 1.1s infinite;font-style:normal}
.composer{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:9px;align-items:flex-end}
.online{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;align-self:start}
.online h3{font-size:11px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.on-u{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px}
.on-u .pip{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.on-u .pip.idle{background:var(--amber)}

/* ---------- codes ---------- */
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.code{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px}
.code.fresh{animation:flash 2.4s ease-out}
.code.dead{opacity:.55}
.code .gm{font-weight:700;font-size:13.5px}
.code .val{display:flex;gap:7px;align-items:center}
.code .val code{flex:1;font-family:var(--mono);font-size:13.5px;letter-spacing:.06em;background:var(--surface-2);
  border:1px dashed var(--border);border-radius:8px;padding:8px 10px;text-align:center;color:var(--amber);
  user-select:all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code .val code.hidden{color:var(--dimmer);letter-spacing:.28em;user-select:none}
.bar{height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.low i{background:var(--rose)}
.code .works{display:flex;justify-content:space-between;font-size:11px;color:var(--dimmer);font-family:var(--mono)}
.code .foot{display:flex;gap:7px;align-items:center;margin-top:auto}

/* ---------- notifications / moderation ---------- */
.nlist .n{display:flex;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:11px;
  background:var(--surface);cursor:pointer;align-items:flex-start}
.nlist .n+.n{margin-top:7px}
.nlist .n:hover{background:var(--surface-2)}
.nlist .n.unread{border-color:#2c3c66;background:#141c30}
.nlist .n .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;background:var(--surface-2)}
.nlist .n .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-top:8px}

.rep{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:13px 15px}
.rep+.rep{margin-top:9px}
.rep.urgent{border-color:#4a2130}
.rep .q{border-left:2px solid var(--border);padding-left:11px;color:#cfd5e6;font-size:12.5px;margin:9px 0}
.rep .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.log{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:6px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:10px}
.log .t{color:var(--dimmer);flex:none}

/* ---------- giriş ---------- */
.login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;background:var(--bg)}
.login::before{content:"";position:absolute;inset:0;
  background:radial-gradient(720px 420px at 20% -10%,#1b2a55 0%,transparent 62%),
             radial-gradient(620px 380px at 100% 110%,#2a1d47 0%,transparent 60%)}
.login-box{position:relative;width:min(374px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:26px 24px}
.login-box h1{font-size:17px;margin:14px 0 3px}
.login-box .s{color:var(--dimmer);font-size:12px;margin:0 0 20px}
.login-box .f{margin-bottom:12px}
.login-err{color:var(--rose);font-size:11.5px;min-height:17px;margin:2px 0 8px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:9px 15px;font-size:12.5px;animation:rise .2s ease-out;
  box-shadow:0 14px 30px -14px #000}

@media (max-width:820px){
  .shell{grid-template-columns:64px 1fr}
  .brand .n,.brand .s,.nav-i span.lbl,.me .info{display:none}
  .nav-i{justify-content:center}
  .nav-i .ct{margin-left:0}
  .chat-wrap{grid-template-columns:1fr}
  .online{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="mark">C</div>
      <div style="min-width:0">
        <div class="n">Community Hub</div>
        <div class="s">players · codes · chat</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="me">
      <div id="me-av"></div>
      <div class="info">
        <div class="nm" id="me-nm"></div>
        <div class="rp" id="me-rp"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="top">
      <div>
        <h1 id="pg-title">Feed</h1>
        <div class="sub" id="pg-sub"></div>
      </div>
      <button class="live" id="live-btn"><span class="pip"></span><span id="live-tx">live</span></button>
    </div>
    <div class="page" id="page"></div>
  </main>
</div>

<!-- ===== GİRİŞ — gerçek sistemin akışı: kullanıcı adı + şifre ===== -->
<div class="login" id="login">
  <form class="login-box" id="login-form" autocomplete="off">
    <div class="brand" style="padding:0;border:0">
      <div class="mark">C</div>
      <div><div class="n">Community Hub</div><div class="s">players · codes · chat</div></div>
    </div>
    <h1>Welcome back</h1>
    <p class="s">Sign in to post, vote and chat.</p>
    <div class="f"><label class="lb" for="l-u">Username</label><input id="l-u" type="text" value="nova_rift"></div>
    <div class="f"><label class="lb" for="l-p">Password</label><input id="l-p" type="password" value="demo1234"></div>
    <div class="login-err" id="l-err"></div>
    <div style="display:flex;gap:9px">
      <button class="btn" type="submit" style="flex:1">Sign in</button>
      <button class="btn ghost" type="button" id="l-skip">Skip</button>
    </div>
    <p class="hint" style="margin:16px 0 0">
      Demo: any value signs you in. The real system hashes the password, rate-limits sign-ins per IP
      and carries an anti-forgery token on every write.
    </p>
  </form>
</div>

<script>
"use strict";

/* ===========================================================================
   0) YARDIMCILAR
   =========================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const AZALT = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/** Avatar rengi addan türetiliyor — görsel indirilmiyor, yine de kişi başına sabit. */
const PALET = ["#5b8cff","#a78bfa","#3fd68c","#f5a524","#f2557a","#38bdf8","#fb923c","#4ade80"];
function renk(ad) {
  let h = 0;
  for (let i = 0; i < ad.length; i++) h = (h * 31 + ad.charCodeAt(i)) >>> 0;
  return PALET[h % PALET.length];
}
function bashar(ad) {
  const p = ad.replace(/[^a-zA-Z0-9]+/g, " ").trim().split(" ");
  return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase();
}
function avatar(ad, sinif) {
  return `<div class="av ${sinif || ""}" style="background:${renk(ad)}" aria-hidden="true">${esc(bashar(ad))}</div>`;
}

const dk = 60000, sa = 60 * dk, gun = 24 * sa;
/** "3m ago" — mutlak saat yazmıyoruz, demo her açıldığında taze görünsün. */
function gecen(t) {
  const d = Date.now() - t;
  if (d < 45000) return "just now";
  if (d < sa) return Math.round(d / dk) + "m ago";
  if (d < gun) return Math.round(d / sa) + "h ago";
  return Math.round(d / gun) + "d ago";
}
/** Kod son kullanma sayacı: "2d 4h" / "38m" / "expired" */
function kalan(t) {
  const d = t - Date.now();
  if (d <= 0) return "expired";
  if (d < sa) return Math.floor(d / dk) + "m left";
  if (d < gun) return Math.floor(d / sa) + "h " + Math.floor((d % sa) / dk) + "m left";
  return Math.floor(d / gun) + "d " + Math.floor((d % gun) / sa) + "h left";
}
let uid = 100;
const yeniId = () => ++uid;
const rastgele = a => a[Math.floor(Math.random() * a.length)];

function toast(msg) {
  $$(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

    <div style="display:flex;gap:9px;margin-top:10px;align-items:center">
      <button class="btn" id="nc-go">Post code</button>
      <span class="hint">It goes live at the top with a running countdown and zero votes.</span>
    </div>
  </div>

  <div class="rowsplit">
    <h2 class="sect">Live codes · ${canli.length}</h2>
    <span class="hint">Three “does not work” votes and a code is pulled automatically.</span>
  </div>
  ${canli.length ? `<div class="codes">${canli.map(kodKarti).join("")}</div>`
                 : '<div class="empty">No live codes right now — post one above.</div>'}

  ${olu.length ? `<div class="sep"></div>
    <h2 class="sect" style="margin-bottom:12px">Expired · ${olu.length}</h2>
    <div class="codes">${olu.map(kodKarti).join("")}</div>` : ""}`;
}

function kodKarti(c) {
  const toplam = c.calisir + c.calismaz;
  const oran = toplam ? Math.round((c.calisir / toplam) * 100) : 0;
  const bitti = c.biter <= Date.now();
  return `<div class="code${bitti ? " dead" : ""}${c.taze ? " fresh" : ""}" data-c="${c.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <div><div class="gm">${esc(c.oyun)}</div><div class="dimmer" style="font-size:11.5px">${esc(c.verir)}</div></div>
      <span class="tag ${bitti ? "r" : (c.biter - Date.now() < 2 * sa ? "m" : "g")}">${kalan(c.biter)}</span>
    </div>
    <div class="val">
      <code class="${c.acik || bitti ? "" : "hidden"}">${c.acik || bitti ? esc(c.kod) : "••••••••••"}</code>
      ${!bitti ? `<button class="btn mini ghost" data-reveal="${c.id}">${c.acik ? "Copy" : "Reveal"}</button>` : ""}
    </div>
    <div>
      <div class="bar${oran < 60 ? " low" : ""}"><i style="width:${oran}%"></i></div>
      <div class="works"><span>${oran}% say it works</span><span>${c.calisir} / ${toplam} votes</span></div>
    </div>
    <div class="foot">
      ${!bitti ? `
        <button class="btn mini ${c.oyum === 1 ? "ok" : "ghost"}" data-cw="${c.id}" data-w="1">✓ works</button>
        <button class="btn mini ${c.oyum === -1 ? "danger" : "ghost"}" data-cw="${c.id}" data-w="-1">✕ dead</button>` : ""}
      <span class="dimmer" style="margin-left:auto;font-size:11px">by ${esc(c.ekleyen)}</span>
    </div>
  </div>`;
}

/* ===========================================================================
   6) BİLDİRİMLER
   =========================================================================== */
const N_IC = { reply: "💬", code: "🎟️", mention: "@", mod: "🛡️" };

function bildirimSayfasi() {
  return `
  <div class="rowsplit">
    <h2 class="sect">Notifications ${okunmamis() ? `· ${okunmamis()} unread` : ""}</h2>
    <div style="display:flex;gap:8px">
      <button class="btn mini ghost" id="n-read">Mark all read</button>
      <button class="btn mini ghost" id="n-clear">Clear</button>
    </div>
  </div>
  ${S.notifs.length ? `<div class="nlist">${S.notifs.slice().sort((a, b) => b.t - a.t).map(n => `
    <div class="n${n.okunmadi ? " unread" : ""}" data-n="${n.id}">
      <div class="ic">${N_IC[n.tip] || "•"}</div>
      <div style="min-width:0;flex:1">
        <div>${esc(n.tx)}</div>
        <div class="dimmer" style="font-size:11.5px;margin-top:2px">${gecen(n.t)}</div>
      </div>
      ${n.okunmadi ? '<span class="dot"></span>' : ""}
    </div>`).join("")}</div>`
    : '<div class="empty">Nothing new. Anything that arrives while you are here lands at the top.</div>'}`;
}

/* ===========================================================================
   7) MODERASYON
   =========================================================================== */
const SEBEP_ET = { spam: "r", "dead code": "m", "wrong category": "a" };

function modSayfasi() {
  const b = ben();
  return `
  ${b.mod ? "" : `<div class="card" style="margin-bottom:14px;border-color:#3a3016">
    <b>You are signed in as a regular member.</b>
    <p class="hint" style="margin:6px 0 10px">In the real system this whole screen is behind a role check —
    a member never receives the markup, not just the button. It is shown here so the demo is walkable.</p>
    <button class="btn mini" id="mod-on">View as moderator</button>
  </div>`}

  <div class="rowsplit">
    <h2 class="sect">Report queue · ${S.reports.length}</h2>
    <span class="hint">Sorted by report count. Three or more reports auto-hides the content until reviewed.</span>
  </div>

  ${S.reports.length ? S.reports.slice().sort((a, b2) => b2.sayi - a.sayi).map(r => `
    <div class="rep${r.sayi >= 3 ? " urgent" : ""}" data-r="${r.id}">
      <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <span class="tag">${esc(r.tur)}</span>
        <span class="tag ${SEBEP_ET[r.sebep] || ""}">${esc(r.sebep)}</span>
        <span class="dimmer" style="font-size:11.5px">about <b>${esc(r.hakkinda)}</b> · ${gecen(r.t)}</span>
        <span class="tag ${r.sayi >= 3 ? "r" : ""}" style="margin-left:auto">${r.sayi} ${r.sayi === 1 ? "report" : "reports"}${r.sayi >= 3 ? " · auto-hidden" : ""}</span>
      </div>
      <div class="q">${esc(r.alinti)}</div>
      <div class="acts">
        <button class="btn mini ok"     data-ract="keep"   data-r="${r.id}">Keep — no action</button>
        <button class="btn mini danger" data-ract="remove" data-r="${r.id}">Remove content</button>
        <button class="btn mini ghost"  data-ract="mute"   data-r="${r.id}">Mute author 24h</button>
      </div>
    </div>`).join("") : '<div class="empty">Queue is clear. New reports arrive at the top.</div>'}

  <div class="sep"></div>
  <h2 class="sect" style="margin-bottom:10px">Moderation log</h2>
  <div class="card">
    ${S.modlog.slice(0, 10).map(l => `<div class="log"><span class="t">${gecen(l.t)}</span><span>${esc(l.tx)}</span></div>`).join("")}
  </div>`;
}

function modKaydi(tx) {
  S.modlog.unshift({ t: Date.now(), tx });
  S.modlog = S.modlog.slice(0, 20);
}

/* ===========================================================================
   8) OLAY BAĞLARI — her çizimden sonra yeniden kuruluyor
   =========================================================================== */
function baglantilariKur() {
  /* --- feed --- */
  $$("[data-f]").forEach(b => b.addEventListener("click", () => { S.filtre = b.dataset.f; ciz(); }));
  $$(".topic").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest(".vote")) return;
    S.acikKonu = Number(el.dataset.t);
    ciz();
  }));
  $$("[data-v]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = S.topics.find(x => x.id === Number(b.dataset.t));
    if (!t) return;
    const v = Number(b.dataset.v);
    // Aynı oka tekrar basmak oyu geri alır — tek yönlü artan sayaç yanlış olurdu.
    t.puan += (t.oyum === v ? -v : (t.oyum === 0 ? v : 2 * v));
    t.oyum = t.oyum === v ? 0 : v;
    ciz();
  }));
  const ntGo = $("#nt-go");
  if (ntGo) ntGo.addEventListener("click", () => {
    const bas = $("#nt-title").value.trim();
    if (!bas) { $("#nt-title").focus(); return; }
    S.topics.unshift({
      id: yeniId(), baslik: bas, kat: $("#nt-cat").value, yazar: S.ben, t: Date.now(),
      puan: 1, oyum: 1, yorumSayisi: 0, ozet: $("#nt-body").value.trim() || "(no extra context)",
      pinned: false, yorumlar: [], taze: true
    });
    ben().rep += 5;
    toast("Topic posted · +5 rep");
    ciz();
  });

  /* --- konu --- */
  const geri = $("#geri");
  if (geri) geri.addEventListener("click", () => { S.acikKonu = null; ciz(); });
  const cGo = $("#c-go");
  if (cGo) cGo.addEventListener("click", () => {
    const t = S.topics.find(x => x.id === S.acikKonu);
    const tx = $("#c-tx").value.trim();
    if (!t || !tx) { $("#c-tx").focus(); return; }
    t.yorumlar.push({ id: yeniId(), yazar: S.ben, t: Date.now(), tx, begeni: 0 });
    t.yorumSayisi++;
    ben().rep += 2;
    toast("Reply posted · +2 rep");
    ciz();
  });
  $$("[data-clike]").forEach(b => b.addEventListener("click", () => {
    const t = S.topics.find(x => x.id === S.acikKonu);
    const c = t && t.yorumlar.find(x => x.id === Number(b.dataset.clike));
    if (!c) return;
    c.begeni = (c.begeni || 0) + (c.begendim ? -1 : 1);
    c.begendim = !c.begendim;
    ciz();
  }));
  $$("[data-cdel]").forEach(b => b.addEventListener("click", () => {
    const t = S.topics.find(x => x.id === S.acikKonu);
    if (!t) return;
    t.yorumlar = t.yorumlar.filter(x => x.id !== Number(b.dataset.cdel));
    t.yorumSayisi = Math.max(0, t.yorumSayisi - 1);
    toast("Reply deleted");
    ciz();
  }));
  $$("[data-crep]").forEach(b => b.addEventListener("click", () => {
    const t = S.topics.find(x => x.id === S.acikKonu);
    const c = t && t.yorumlar.find(x => x.id === Number(b.dataset.crep));
    if (!c) return;
    S.reports.unshift({ id: yeniId(), tur: "comment", hakkinda: c.yazar, sebep: "spam", sayi: 1,
                        alinti: c.tx.slice(0, 120), t: Date.now() });
    toast("Reported — it is in the moderation queue");
    ciz();
  }));

  /* --- sohbet --- */
  const chGo = $("#ch-go");
  if (chGo) {
    const gonder = () => {
      const tx = $("#ch-tx").value.trim();
      if (!tx) return;
      S.chat.push({ id: yeniId(), yazar: S.ben, t: Date.now(), tx, silindi: false, taze: true });
      S.chat = S.chat.slice(-60);
      $("#ch-tx").value = "";
      ciz();
      $("#ch-tx").focus();
    };
    chGo.addEventListener("click", gonder);
    $("#ch-tx").addEventListener("keydown", e => { if (e.key === "Enter") gonder(); });
    sohbetiAsagiKaydir();
    yaziyorCiz();
  }
  $$("[data-mdel]").forEach(b => b.addEventListener("click", () => {
    const m = S.chat.find(x => x.id === Number(b.dataset.mdel));
    if (!m) return;
    m.silindi = true;
    modKaydi(`${S.ben} removed a chat message`);
    ciz();
  }));

  /* --- kodlar --- */
  $$("[data-reveal]").forEach(b => b.addEventListener("click", () => {
    const c = S.codes.find(x => x.id === Number(b.dataset.reveal));
    if (!c) return;
    if (!c.acik) { c.acik = true; ciz(); return; }
    // Panoya kopyalama sandbox'ta engellenebilir — sessizce başarısız olmasın.
    try {
      navigator.clipboard.writeText(c.kod).then(() => toast("Code copied"),
        () => toast("Copy blocked in the sandbox — select the code and copy"));
    } catch (e) {
      toast("Copy blocked in the sandbox — select the code and copy");
    }
  }));
  $$("[data-cw]").forEach(b => b.addEventListener("click", () => {
    const c = S.codes.find(x => x.id === Number(b.dataset.cw));
    if (!c) return;
    const v = Number(b.dataset.w);
    if (c.oyum === v) {                       // oyu geri al
      v === 1 ? c.calisir-- : c.calismaz--;
      c.oyum = 0;
    } else {
      if (c.oyum === 1) c.calisir--;
      if (c.oyum === -1) c.calismaz--;
      v === 1 ? c.calisir++ : c.calismaz++;
      c.oyum = v;
    }
    // Kural: üç "çalışmıyor" fazlası kodu düşürür ve moderasyon kaydına yazar.
    if (c.calismaz >= c.calisir + 3 && c.biter > Date.now()) {
      c.biter = Date.now() - 1000;
      modKaydi(`auto: ${c.kod} pulled after community votes`);
      toast(`${c.kod} pulled — the community voted it dead`);
    }
    ciz();
  }));
  const ncGo = $("#nc-go");
  if (ncGo) ncGo.addEventListener("click", () => {
    const oyun = $("#nc-game").value.trim(), kod = $("#nc-code").value.trim();
    if (!oyun) { $("#nc-game").focus(); return; }
    if (!kod)  { $("#nc-code").focus(); return; }
    S.codes.unshift({
      id: yeniId(), oyun, kod: kod.toUpperCase(), verir: $("#nc-gives").value.trim() || "unspecified reward",
      calisir: 0, calismaz: 0, biter: Date.now() + Number($("#nc-exp").value) * sa,
      ekleyen: S.ben, acik: true, oyum: 0, t: Date.now(), taze: true
    });
    ben().rep += 10;
    toast("Code posted · +10 rep");
    ciz();
  });

  /* --- bildirimler --- */
  $$("[data-n]").forEach(el => el.addEventListener("click", () => {
    const n = S.notifs.find(x => x.id === Number(el.dataset.n));
    if (n) n.okunmadi = false;
    ciz();
  }));
  const nRead = $("#n-read");
  if (nRead) nRead.addEventListener("click", () => { S.notifs.forEach(n => { n.okunmadi = false; }); ciz(); });
  const nClear = $("#n-clear");
  if (nClear) nClear.addEventListener("click", () => { S.notifs = []; ciz(); });

  /* --- moderasyon --- */
  const modOn = $("#mod-on");
  if (modOn) modOn.addEventListener("click", () => { ben().mod = true; toast("Moderator tools unlocked"); ciz(); });
  $$("[data-ract]").forEach(b => b.addEventListener("click", () => {
    const r = S.reports.find(x => x.id === Number(b.dataset.r));
    if (!r) return;
    const act = b.dataset.ract;
    S.reports = S.reports.filter(x => x.id !== r.id);
    if (act === "keep")   modKaydi(`${S.ben} kept reported ${r.tur} by ${r.hakkinda} (no action)`);
    if (act === "remove") modKaydi(`${S.ben} removed a ${r.tur} by ${r.hakkinda} (${r.sebep})`);
    if (act === "mute")   modKaydi(`${S.ben} muted ${r.hakkinda} for 24h (${r.sebep})`);
    toast(act === "keep" ? "Kept — nothing removed" : act === "remove" ? "Content removed" : "Author muted for 24h");
    ciz();
  }));

  // "taze" işareti tek seferlik: vurgu animasyonu bir kez oynasın.
  setTimeout(() => {
    S.topics.forEach(t => delete t.taze);
    S.codes.forEach(c => delete c.taze);
    S.chat.forEach(m => delete m.taze);
  }, 400);
}

/* ===========================================================================
   9) CANLI AKIŞ SİMÜLASYONU
   ---------------------------------------------------------------------------
   Gerçek sistemde bu trafik SignalR üzerinden gelir. Burada websocket yok:
   tek zamanlayıcı sahte etkinlik üretiyor. Amaç ekranın yaşadığını göstermek —
   demo şeridi bunun simülasyon olduğunu açıkça yazıyor.
   ⛔ prefers-reduced-motion açıkken KAPALI başlar: kendiliğinden değişen içerik
      de harekettir; kullanıcı isterse elle tetikler.
   =========================================================================== */
const SOHBET_ORNEK = [
  "just redeemed the Frost Circuit one, worked fine",
  "does the dive charge code stack with the season pass?",
  "wiki page for the patch is updated, link in the thread",
  "three of us confirmed the crash now, it is not device specific",
  "reminder that codes are region locked sometimes",
  "the new livery looks so much better in motion",
  "anyone running the low-latency mode? worth it?",
  "thanks for pulling the dead one, that was on me"
];
const KONU_ORNEK = [
  ["Weekly code roundup — what still works", "codes"],
  ["Is the new dive animation slower or am I imagining it?", "help"],
  ["Low-spec settings that actually help", "builds"],
  ["Menu freezes when switching profiles", "bugs"],
  ["What are you all playing between updates?", "offtop"]
];

/** Aynı cümle arka arkaya düşmesin — tekrar, simülasyonu anında ele veriyor. */
let sonCumle = "";
function sohbetCumlesi() {
  let c = rastgele(SOHBET_ORNEK);
  for (let i = 0; i < 5 && c === sonCumle; i++) c = rastgele(SOHBET_ORNEK);
  sonCumle = c;
  return c;
}

function birOlay() {
  const digerleri = S.users.filter(u => u.ad !== S.ben && u.durum !== "offline");
  const kim = rastgele(digerleri).ad;
  const zar = Math.random();

  if (zar < 0.40) {
    // sohbet mesajı — önce "yazıyor", sonra mesaj
    S.yaziyor = kim;
    if (S.page === "chat" && !S.acikKonu) yaziyorCiz();
    setTimeout(() => {
      S.yaziyor = null;
      S.chat.push({ id: yeniId(), yazar: kim, t: Date.now(), tx: sohbetCumlesi(), silindi: false, taze: true });
      S.chat = S.chat.slice(-60);
      if (S.page === "chat" && !S.acikKonu) ciz();
    }, 1400);
    return;
  }
  if (zar < 0.62) {
    // konu oylaması — sayılar kıpırdasın
    const t = rastgele(S.topics);
    if (t) t.puan += Math.random() < 0.82 ? 1 : -1;
    if (S.page === "feed") ciz();
    return;
  }
  if (zar < 0.76) {
    // kod oylaması
    const c = rastgele(S.codes.filter(x => x.biter > Date.now()));
    if (c) (Math.random() < 0.78 ? c.calisir++ : c.calismaz++);
    if (S.page === "codes") ciz();
    return;
  }
  if (zar < 0.88) {
    // bildirim
    const tip = rastgele(["reply", "mention", "code"]);
    // Kod bildirimleri tek kalıp olunca liste birebir aynı satırı iki kez
    // gösteriyordu — gerçek bir akış öyle görünmez.
    const c = rastgele(S.codes.filter(x => x.biter > Date.now())) || S.codes[0];
    const kodTx = c ? rastgele([
      `${c.kod} passed ${c.calisir} “works” votes`,
      `${c.oyun}: a new code was posted by ${kim}`,
      `${c.kod} is close to expiring`,
      `Your vote on ${c.kod} was counted`
    ]) : "A code you follow was updated";
    const tx = tip === "reply"   ? `${kim} replied to a topic you follow`
             : tip === "mention" ? `${kim} mentioned you in the live chat`
             :                     kodTx;
    if (S.notifs[0] && S.notifs[0].tx === tx) return;   // birebir aynısını tekrar yazma
    S.notifs.unshift({ id: yeniId(), tip, tx, t: Date.now(), okunmadi: true });
    S.notifs = S.notifs.slice(0, 20);
    S.page === "notifs" ? ciz() : navCiz();
    return;
  }
  // yeni konu
  const k = rastgele(KONU_ORNEK);
  S.topics.unshift({
    id: yeniId(), baslik: k[0], kat: k[1], yazar: kim, t: Date.now(),
    puan: 1, oyum: 0, yorumSayisi: 0, ozet: "(opened just now — nobody has replied yet)",
    pinned: false, yorumlar: [], taze: true
  });
  S.topics = S.topics.slice(0, 24);
  if (S.page === "feed" && !S.acikKonu) ciz();
}

let zamanlayici = null;
function akisiAyarla() {
  clearInterval(zamanlayici);
  // Yazı yazarken yeniden çizim odağı düşürür — o an olay üretme.
  if (S.canli) zamanlayici = setInterval(() => {
    const a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && a.value) return;
    birOlay();
  }, 4200);
}
/* Son kullanma sayaçları akıştan bağımsız ilerlemeli: kod sayfası açıkken
   yarım dakikada bir tazelenir, yoksa "39m left" donmuş görünür. */
setInterval(() => {
  if (S.page !== "codes" || S.acikKonu) return;
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "SELECT") && a.value) return;
  ciz();
}, 30000);

$("#live-btn").addEventListener("click", () => {
  S.canli = !S.canli;
  akisiAyarla();
  if (!S.canli) toast("Simulated activity paused");
  else { toast("Simulated activity running"); }
  ciz();
});

/* ===========================================================================
   10) İLK ÇİZİM + GİRİŞ EKRANI
   =========================================================================== */
ciz();
akisiAyarla();

// Azaltılmış hareket: akış kapalı başlar, kullanıcı isterse elle tetikler.
if (AZALT) {
  const not = document.createElement("div");
  not.className = "card";
  not.style.margin = "0 22px 18px";
  not.innerHTML = `<b>Live activity is off.</b>
    <p class="hint" style="margin:6px 0 10px">Your system asks for reduced motion, so the simulated stream
    does not start on its own — content that changes by itself is motion too.</p>
    <button class="btn mini" id="tetikle">Simulate some activity</button>`;
  $("#main").insertBefore(not, $("#page"));
  $("#tetikle").addEventListener("click", () => { for (let i = 0; i < 4; i++) birOlay(); });
}

function girisiKapat() { $("#login").style.display = "none"; }

/* Site bu demoyu küçük önizleme olarak gömdüğünde çağırır: önizleme tıklanamaz,
   giriş ekranında kilitli kalmasın. Tam ekranda ÇAĞRILMAZ → giriş akışı görünür. */
window.__onizleme = function () {
  girisiKapat();
  document.documentElement.dataset.preview = "1";
};

$("#login-form").addEventListener("submit", e => {
  e.preventDefault();
  const u = $("#l-u").value.trim();
  if (!u || !$("#l-p").value) { $("#l-err").textContent = "Both fields are needed (any value works here)."; return; }
  if (u !== S.ben) {                 // başka adla girildiyse o kişi olarak devam
    if (!S.users.some(x => x.ad === u)) S.users.push({ ad: u, rep: 0, mod: false, durum: "online" });
    S.ben = u;
    ciz();
  }
  girisiKapat();
});
$("#l-skip").addEventListener("click", girisiKapat);
</script>
</body>
</html>
